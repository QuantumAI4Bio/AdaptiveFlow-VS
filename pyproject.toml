[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
xfail_strict = true

[tool.ruff]
target-version = "py312"
extend-exclude = ["tools/bin"]

[tool.ruff.lint]
# Start with syntax, invalid control flow, and undefined names, without reformatting legacy code.
select = ["E9", "F63", "F7", "F82"]
