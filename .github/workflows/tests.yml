name: tests

# The suite is offline by construction: no cloud account, credentials or
# network access are involved, and constructing a live cloud client inside
# the tests is a failure. This workflow therefore cannot incur cloud spend.
on:
  push:
    branches: [develop, 'feature/**']
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest boto3 pandas pyarrow jinja2 \
            google-cloud-batch google-cloud-storage

      - name: Run the offline test suite
        env:
          # Make an accidental AWS call fail fast rather than reach for
          # instance metadata or a developer's ambient configuration.
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_CONFIG_FILE: /dev/null
          AWS_SHARED_CREDENTIALS_FILE: /dev/null
        run: pytest -ra
